# Blowfish site options.
# See README.md for the active site conventions.

colorScheme = "zjutmc"
defaultAppearance = "light" # valid options: light or dark
autoSwitchAppearance = false

enableA11y = false
enableSearch = true
enableCodeCopy = false
enableStructuredBreadcrumbs = false

replyByEmail = false

mainSections = ["activities"]

disableImageOptimization = false
disableImageOptimizationMD = false
disableTextInHeader = false

defaultBackgroundImage = "img/site/background.svg"
backgroundCanvas = true
defaultFeaturedImage = "img/site/default-cover.webp"
hotlinkFeatureImage = false

highlightCurrentMenuArea = true

fingerprintAlgorithm = "sha512" # Valid values are "sha512" (default), "sha384", "sha256"

giteaDefaultServer = "https://git.fsfe.org"
forgejoDefaultServer = "https://v11.next.forgejo.org"

[languageRedirect]
  enabled = false # Enable client-side language redirects for multilingual sites.
  storageKey = "blowfish_preferred_language" # localStorage key for manual language selections.
  browserRedirectHomeOnly = true # Restrict browser-language redirects to home pages.
  storedLanguageRedirect = true # Redirect to the stored language when a matching translation exists.

[header]
  layout = "floating"
  mobileMenuStyle = "dropdown"

[footer]
  showMenu = true
  showCopyright = true
  showThemeAttribution = true
  showAppearanceSwitcher = false
  showScrollToTop = true

[homepage]
  layout = "landing"
  showRecent = true
  showRecentItems = 3
  showMoreLink = true
  showMoreLinkDest = "/activities/"
  cardView = true
  cardViewScreenWidth = false
  layoutBackgroundBlur = false # only used when layout equals background
  disableHeroImageFilter = false # only used when layout equals hero

[article]
  showDate = false
  showViews = false
  showLikes = false
  showDateOnlyInArticle = false
  showDateUpdated = false
  showAuthor = false
  showHero = true
  heroStyle = "background"
  layoutBackgroundBlur = true # only used when heroStyle equals background or thumbAndBackground
  layoutBackgroundBlurStyle = "fade" # Native gradient mask and scroll fade.
  layoutBackgroundHeaderSpace = true # only used when heroStyle equals background
  showBreadcrumbs = true
  showDraftLabel = true
  showEdit = false
  editAppendPath = true
  seriesOpened = false
  showHeadingAnchors = true
  showPagination = false
  invertPagination = false
  showReadingTime = false
  showReadingProgress = false
  showTableOfContents = false
  showTaxonomies = false # Enable the display of taxonomies for the related article.
  showCategories = true # These will show if showTaxonomies is true.
  showTags = true # These will show if showTaxonomies is true.
  showCategoriesInSecondaryColor = false # This will change the color of category badges, so the user can better distinguish between the two. Only if showTaxonomies is true.
  showAuthorsBadges = false
  showWordCount = false
  showZenMode = false

[list]
  showHero = true
  featureImageHover = true
  heroStyle = "background"
  layoutBackgroundBlur = true # only used when heroStyle equals background or thumbAndBackground
  layoutBackgroundBlurStyle = "fade"
  layoutBackgroundHeaderSpace = true # only used when heroStyle equals background
  showBreadcrumbs = true
  showSummary = true
  showViews = false
  showLikes = false
  showTableOfContents = false
  showCards = false
  orderByWeight = false
  groupByYear = false
  cardView = true
  cardViewScreenWidth = false
  constrainItemsWidth = false

[sitemap]
  excludedKinds = ["taxonomy", "term"]

[taxonomy]
  showTermCount = true
  showHero = true
  heroStyle = "background"
  layoutBackgroundBlur = true # only used when heroStyle equals background or thumbAndBackground
  layoutBackgroundBlurStyle = "fade"
  layoutBackgroundHeaderSpace = true # only used when heroStyle equals background
  showBreadcrumbs = true
  showViews = false
  showLikes = false
  showTableOfContents = false
  cardView = false

[term]
  showHero = true
  heroStyle = "background"
  layoutBackgroundBlur = true # only used when heroStyle equals background or thumbAndBackground
  layoutBackgroundBlurStyle = "fade"
  layoutBackgroundHeaderSpace = true # only used when heroStyle equals background
  showBreadcrumbs = true
  showViews = false
  showLikes = false
  showTableOfContents = true
  groupByYear = false
  cardView = false
  cardViewScreenWidth = false
